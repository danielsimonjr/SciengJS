<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>six blocks</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11.16.0/dist/mermaid.min.js" integrity="sha384-T/0lMUdJpd2S1ZHtRiofG3htU3xPCrFVeAQ1UUE2TJwlEJSV5NUwn30kP28n238E" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@viz-js/viz@3.28.0/dist/viz-global.min.js" integrity="sha384-jv5ql4TEr9ULyGfjHq2FtVcK4+Eda4mfBLyS+yMQpx8ncVHQk+U0TIgGQ4L6EXCk" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.css" integrity="sha384-zh0CIslj+VczCZtlzBcjt5ppRcsAmDnRem7ESsYwWwg3m/OaJ2l4x7YBZl9Kxxib" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/katex.min.js" integrity="sha384-Rma6DA2IPUwhNxmrB/7S3Tno0YY7sFu9WSYMCuulLhIqYSGZ2gKCJWIqhBWqMQfh" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.21/dist/contrib/auto-render.min.js" integrity="sha384-hCXGrW6PitJEwbkoStFjeJxv+fSOOQKOPbJxSfM6G5sWZjAyWhXiTIIAmQqnlLlh" crossorigin="anonymous"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" integrity="sha384-cCVCZkAjYNxaYKbM8lsArLznDF/SvMFr1jcZrvOpSTCa0W40ZAdLzHCEulnUa5i7" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/wavedrom/3.1.0/skins/default.js" integrity="sha384-8bvnUBb8hQiJxDdvLdFFeS112d/Mc65xTihoALPDR2RAqKgtvpyE61eUPj3f8NrZ" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/wavedrom/3.1.0/wavedrom.min.js" integrity="sha384-ZxcO4Va8vGMKlVz1cdMB+9lv/IdAUuNTigvTrcrJOBz4cbucyxkIzfBIaSMdSOmI" crossorigin="anonymous"></script>
  <style>
    :root { --bg: #1a1a2e; --fg: #e0e0e0; --accent: #00d2ff; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--fg); padding: 2rem; }
    section { margin: 2rem 0; }
    h2 { color: var(--accent); margin-bottom: 1rem; }
    .mermaid { background: transparent; }
    .latex-block { margin: 1.5rem 0; }
    .wavedrom-block { background: #fff; color: #000; padding: 1rem; border: 1px solid #8a8a8a; border-radius: 4px; overflow-x: auto; }
  </style>
</head>
<body>
<section>
<h2>Flow</h2>
<div class="scieng-block" data-scieng-source="graph TD
  A[&quot;a &lt; b &amp; c&quot;] --&gt; B"><pre class="mermaid">graph TD
  A["a &lt; b &amp; c"] --&gt; B</pre></div>
</section>
<section>
<h2>Graph</h2>
<div class="scieng-block" data-scieng-source="digraph G { a -&gt; b [label=&quot;x&lt;y&quot;]; }"><div id="dot-1"></div>
<script>Viz.instance().then(v => document.getElementById("dot-1").appendChild(v.renderSVGElement("digraph G { a -> b [label=\"x\u003cy\"]; }")));</script></div>
</section>
<section>
<h2>Eq</h2>
<div class="scieng-block" data-scieng-source="E = mc^2 \quad a&lt;b"><div class="latex-block">\[E = mc^2 \quad a&lt;b\]</div></div>
</section>
<section>
<h2>Plot</h2>
<div class="scieng-block" data-scieng-source="{&quot;data&quot;:[{&quot;x&quot;:[0,1],&quot;y&quot;:[1,0]}],&quot;layout&quot;:{}}"><div id="plotly-3"></div>
<script>Plotly.newPlot("plotly-3", [{"x":[0,1],"y":[1,0]}], {});</script></div>
</section>
<section>
<h2>Wave</h2>
<div class="scieng-block" data-scieng-source="{ &quot;signal&quot;: [{ &quot;name&quot;: &quot;clk&quot;, &quot;wave&quot;: &quot;p...&quot; }] }"><div class="wavedrom-block"><script type="WaveDrom">{ "signal": [{ "name": "clk", "wave": "p..." }] }</script></div></div>
</section>
<section>
<h2>Raw</h2>
<div class="scieng-block" data-scieng-source="&lt;p&gt;raw `tick` &amp; &quot;q&quot;&lt;/p&gt;"><p>raw `tick` & "q"</p></div>
</section>
<script>
mermaid.initialize({ startOnLoad: true, theme: "dark" });
window.addEventListener("load", () => WaveDrom.ProcessAll());
document.addEventListener("DOMContentLoaded", () => {
    renderMathInElement(document.body, { delimiters: [
      { left: "\\[", right: "\\]", display: true },
      { left: "$$", right: "$$", display: true },
      { left: "\\(", right: "\\)", display: false },
      { left: "\\begin{equation}", right: "\\end{equation}", display: true },
      { left: "\\begin{equation*}", right: "\\end{equation*}", display: true },
      { left: "\\begin{align}", right: "\\end{align}", display: true },
      { left: "\\begin{align*}", right: "\\end{align*}", display: true },
      { left: "\\begin{gather}", right: "\\end{gather}", display: true },
      { left: "\\begin{gather*}", right: "\\end{gather*}", display: true },
    ]});
  });
</script>
</body>
</html>
