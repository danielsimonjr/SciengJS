name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default. No job publishes a package and no job requests an OIDC token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: bun test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: /usr/bin/google-chrome
          - os: windows-latest
            browser: C:/Program Files/Google/Chrome/Application/chrome.exe
          - os: macos-latest
            browser: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
    env:
      # The page checker must run in CI. It never skips there.
      SCIENG_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      # The Windows runner keeps its temporary folder on the C: drive, where a fsync stalls the tests.
      - name: Move the temporary folders under the runner temporary folder (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Check that the browser exists
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e "$SCIENG_BROWSER" ]; then
            echo "SCIENG_BROWSER does not name a browser: $SCIENG_BROWSER" >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

  smoke:
    name: built package smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Move the temporary folders under the runner temporary folder (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Pack, install in a fresh folder and import under Node 22
        run: node test/smoke/smoke.mjs

      - name: Worker path of the built package under Node 22 (heap and time limits)
        run: node --test test/node/worker.node.mjs

  # The browser gates: the process tree of each render, the sandbox flag, the large screenshot, and on Linux
  # a render in a network namespace with only loopback plus a negative control. Each system runs Bun and Node 22.
  browser-gates:
    name: browser gates (${{ matrix.os }}, ${{ matrix.runtime }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, runtime: bun, browser: /usr/bin/google-chrome }
          - { os: ubuntu-latest, runtime: node, browser: /usr/bin/google-chrome }
          - { os: windows-latest, runtime: bun, browser: C:/Program Files/Google/Chrome/Application/chrome.exe }
          - { os: windows-latest, runtime: node, browser: C:/Program Files/Google/Chrome/Application/chrome.exe }
          - { os: macos-latest, runtime: bun, browser: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome }
          - { os: macos-latest, runtime: node, browser: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome }
    env:
      SCIENG_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 22
        if: matrix.runtime == 'node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Move the temporary folders under the runner temporary folder (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Unit tests of the browser probes
        run: node --test test/node/browser-probe.node.mjs

      - name: Browser gates on the host network
        if: runner.os != 'Linux'
        run: ${{ matrix.runtime == 'node' && 'node' || 'bun' }} test/node/browser-gates.mjs

      - name: Browser gates in a loopback-only network namespace (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo ip netns add gates
          sudo ip netns exec gates ip link set lo up
          sudo ip netns exec gates ip -brief addr show lo
          sudo ip netns exec gates sudo -u "$USER" env PATH="$PATH" HOME="$HOME" SCIENG_BROWSER="$SCIENG_BROWSER" GATE_REQUIRE_NETNS=1 \
            "$(command -v ${{ matrix.runtime == 'node' && 'node' || 'bun' }})" test/node/browser-gates.mjs

      - name: Remove the network namespace (Linux)
        if: always() && runner.os == 'Linux'
        run: sudo ip netns del gates || true
