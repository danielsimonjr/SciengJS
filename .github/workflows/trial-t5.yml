# Trial T5 (tex build): does the engine's own compiler build tex.web to WASM that passes the trip test?
# Can that build make a format and render, under Bun 1.4.4 and Node 22, with each glyph as a <path>?
# Throwaway trial workflow. Runs only on a push to the trial branch. No secrets, no publish.
# Every action is pinned to a commit. No TeX binary runs: TeX Live gives only the package and font files.
name: trial-t5

on:
  push:
    branches:
      - trial/t5-tex-build

permissions:
  contents: read

jobs:
  build:
    name: build, trip test and format (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: trials/t5-tex-build
    steps:
      - name: Check out the trial commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # The TeX Live files come from the Ubuntu archive of the runner (24.04, TeX Live 2023).
      # apt does not pin them. The installed versions are recorded in the artifact.
      - name: Install the TeX Live file tree (files only; no TeX Live binary runs)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            texlive-base texlive-fonts-recommended texlive-latex-base texlive-latex-extra texlive-pictures
          mkdir -p build/out/results
          dpkg-query -W -f='${Package} ${Version}\n' 'texlive*' > build/out/results/apt-versions.txt
          node --version > build/out/results/node-version.txt

      - name: Build the five programs from the pinned CTAN sources
        run: |
          set -euo pipefail
          node tools/build.mjs build/src build/out/build | tee build/out/results/build-ubuntu-node.json

      - name: Run the trip test
        run: |
          set -euo pipefail
          node tools/trip.mjs build/out/build build/src/tex build/out/trip | tee build/out/results/trip-ubuntu-node.json

      - name: Collect the font files (CM TFM, AMS Type 1 CM)
        run: |
          set -euo pipefail
          TL=/usr/share/texlive/texmf-dist
          mkdir -p build/out/fonts
          for d in "$TL/fonts/tfm/public/cm" "$TL/fonts/tfm/public/knuth-lib" "$TL/fonts/tfm/public/amsfonts/cmextra"; do
            test -d "$d" && cp "$d"/*.tfm build/out/fonts/
          done
          # the AMS Type 1 fonts may be in texmf-dist or in /usr/share/texmf; find them
          pfbdir=$(dirname "$(find /usr/share/texlive /usr/share/texmf /usr/share/fonts -name cmr10.pfb 2>/dev/null | head -1)")
          echo "pfb dir: $pfbdir" | tee build/out/results/font-dirs.txt
          cp "$pfbdir"/cm*.pfb build/out/fonts/
          ls build/out/fonts | wc -l | tee -a build/out/results/font-dirs.txt
          head -c 2000 "$pfbdir/cmr10.pfb" | strings | grep -i -m3 "copyright\|license" | tee build/out/results/pfb-licence.txt
          test -f build/out/fonts/manfnt.tfm
          T5_FONT_DIR=build/out/fonts T5_TFM_DIR=build/out/fonts node --test test/type1.test.mjs 2>&1 | tee build/out/results/type1-test.txt

      - name: Build the plain format
        run: |
          set -euo pipefail
          node tools/tex-run.mjs build/out/build build/out/fmt "plain \\dump" build/src/lib build/out/fonts | tee build/out/results/format-plain.json
          test -f build/out/fmt/plain.fmt
          node tools/sizes.mjs build/out/fmt/plain.fmt build/out/build/texprod.wasm | tee build/out/results/sizes.json

      - name: Probe tikz under the plain format, and the LaTeX kernel
        run: |
          set -euo pipefail
          TL=/usr/share/texlive/texmf-dist
          mkdir -p build/out/probe-tikz build/out/probe-latex
          cp build/out/fmt/plain.fmt build/out/probe-tikz/
          cp samples/probe-tikz.tex build/out/probe-tikz/
          node tools/tex-run.mjs build/out/build build/out/probe-tikz "&plain probe-tikz" build/out/fonts "$TL/tex/plain/pgf" "$TL/tex/generic/pgf" | tee build/out/results/probe-tikz.json
          grep -A4 -m1 '^!' build/out/probe-tikz/probe-tikz.log | tee build/out/results/probe-tikz-error.txt || true
          node tools/tex-run.mjs build/out/build build/out/probe-latex "latex.ltx" build/out/fonts "$TL/tex/latex/base" "$TL/tex/latex/l3kernel" "$TL/tex/generic/hyphen" | tee build/out/results/probe-latex.json
          grep -A2 -m1 '^!' build/out/probe-latex/latex.log | tee build/out/results/probe-latex-error.txt || true
          head -1 "$TL/tex/latex/base/latex.ltx" > /dev/null
          grep -m1 'pgfversion{' "$TL/tex/generic/pgf/pgf.revision.tex" | tee build/out/results/pgf-version.txt
          ls "$TL/tex/latex/circuitikz" "$TL/tex/generic/circuitikz" | head -40 > build/out/results/circuitikz-files.txt
          ls -d "$TL"/tex/*/circuitikz | tee -a build/out/results/circuitikz-files.txt

      - name: Upload the build, the trip outputs, the format and the fonts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: t5-build
          path: trials/t5-tex-build/build/out
          if-no-files-found: error
          retention-days: 14

  measure:
    name: trip test and render (${{ matrix.os }}, ${{ matrix.runtime }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        runtime: [bun, node]
    defaults:
      run:
        shell: bash
        working-directory: trials/t5-tex-build
    steps:
      - name: Check out the trial commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun 1.4.4
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Download the build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: t5-build
          path: trials/t5-tex-build/build/out

      - name: Rebuild, run the trip test and render under the runtime
        run: |
          set -euo pipefail
          run() { if [ "${{ matrix.runtime }}" = "bun" ]; then bun "$@"; else node "$@"; fi; }
          mkdir -p build/results
          node --version > build/results/node-version.txt
          if [ "${{ matrix.runtime }}" = "bun" ]; then bun --version > build/results/bun-version.txt; fi
          run tools/build.mjs build/src build/rebuild | tee build/results/build.json
          run tools/compare-builds.mjs build/out/build/build.json build/rebuild/build.json | tee build/results/same-wasm.json
          run tools/trip.mjs build/rebuild build/src/tex build/results/trip | tee build/results/trip.json
          run tools/render.mjs build/rebuild build/out/fmt/plain.fmt samples/labels.tex build/out/fonts build/results/render 20 | tee build/results/render.json

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: t5-${{ matrix.os }}-${{ matrix.runtime }}
          path: trials/t5-tex-build/build/results/
          if-no-files-found: warn
          retention-days: 14
