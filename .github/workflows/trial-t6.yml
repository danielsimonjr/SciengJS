# Does the T5 toolchain build tex.web + etex.ch + the utility primitives to WASM that passes
# trip and e-TRIP, make the LaTeX format in extended mode and render one circuitikz circuit
# under Bun 1.4.4 and Node 22, with each glyph as a <path>?
# Throwaway trial workflow. Runs only on a push to the trial branch. No secrets, no publish.
# Every action is pinned to a commit. No TeX binary runs: the pinned TeX Live 2023 archives
# give only the source, package and font files.
name: trial-t6

on:
  push:
    branches:
      - trial/t6-etex-build

permissions:
  contents: read

jobs:
  build:
    name: build, e-TRIP, format and render (ubuntu-latest, node)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: trials/t6-etex-build
    steps:
      - name: Check out the trial commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Fetch the pinned sources and build the five programs
        run: |
          set -euo pipefail
          mkdir -p build/out/results
          node --version > build/out/results/node-version.txt
          node tools/build.mjs build/src build/out/build | tee build/out/results/build.json

      - name: Run the trip and e-TRIP tests (etripman.tex, Appendices A and B)
        run: |
          set -euo pipefail
          node tools/etrip.mjs build/out/build build/out/etrip | tee build/out/results/etrip.json

      - name: Build the LaTeX format in extended mode
        run: |
          set -euo pipefail
          TEX_PROGRAM=setprod node ../t5-tex-build/tools/tex-run.mjs build/out/build build/out/fmt "*scieng.ini" \
            format build/src/texmf/tex build/src/texmf/fonts/tfm | tee build/out/results/format.json
          test -f build/out/fmt/scieng.fmt
          grep -a -m1 '^Driver file for pgf:' build/out/fmt/scieng.log | tee build/out/results/pgf-driver.txt
          grep -a -q '^Driver file for pgf: pgfsys-dvisvgm.def' build/out/fmt/scieng.log
          node ../t5-tex-build/tools/sizes.mjs build/out/fmt/scieng.fmt build/out/build/setprod.wasm build/out/build/etextrip.wasm | tee build/out/results/sizes.json
          sha256sum build/out/fmt/scieng.fmt | tee build/out/results/format-sha256.txt

      - name: Render the circuitikz circuit
        run: |
          set -euo pipefail
          TEX_PROGRAM=setprod DVI_SPECIALS=runtime/dvisvgm-specials.mjs node ../t5-tex-build/tools/render.mjs \
            build/out/build build/out/fmt/scieng.fmt samples/circuit.tex build/src/texmf/fonts build/out/render 20 \
            format build/src/texmf/tex | tee build/out/results/render.json
          sha256sum build/out/render/circuit.svg | tee build/out/results/svg-sha256.txt

      - name: Upload the build, the e-TRIP outputs, the format and the render
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: t6-build
          path: trials/t6-etex-build/build/out
          if-no-files-found: error
          retention-days: 14

  measure:
    name: build, e-TRIP, format and render (${{ matrix.os }}, ${{ matrix.runtime }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        runtime: [bun, node]
    defaults:
      run:
        shell: bash
        working-directory: trials/t6-etex-build
    steps:
      - name: Check out the trial commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun 1.4.4
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Download the build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: t6-build
          path: trials/t6-etex-build/build/ref

      - name: Build, run e-TRIP, build the format and render under the runtime
        run: |
          set -euo pipefail
          run() { if [ "${{ matrix.runtime }}" = "bun" ]; then bun "$@"; else node "$@"; fi; }
          R=build/results
          mkdir -p $R
          node --version > $R/node-version.txt
          if [ "${{ matrix.runtime }}" = "bun" ]; then bun --version > $R/bun-version.txt; fi
          run tools/build.mjs build/src build/rebuild | tee $R/build.json
          run ../t5-tex-build/tools/compare-builds.mjs build/ref/build/build.json build/rebuild/build.json | tee $R/same-wasm.json
          run tools/etrip.mjs build/rebuild $R/etrip | tee $R/etrip.json
          TEX_PROGRAM=setprod run ../t5-tex-build/tools/tex-run.mjs build/rebuild $R/fmt "*scieng.ini" \
            format build/src/texmf/tex build/src/texmf/fonts/tfm | tee $R/format.json
          cmp build/ref/fmt/scieng.fmt $R/fmt/scieng.fmt
          echo "same format as the build job" | tee $R/same-format.txt
          TEX_PROGRAM=setprod DVI_SPECIALS=runtime/dvisvgm-specials.mjs run ../t5-tex-build/tools/render.mjs \
            build/rebuild $R/fmt/scieng.fmt samples/circuit.tex build/src/texmf/fonts $R/render 20 \
            format build/src/texmf/tex | tee $R/render.json
          cmp build/ref/render/circuit.svg $R/render/circuit.svg
          echo "same SVG as the build job" | tee $R/same-svg.txt

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: t6-${{ matrix.os }}-${{ matrix.runtime }}
          path: |
            trials/t6-etex-build/build/results/
            !trials/t6-etex-build/build/results/fmt/scieng.fmt
          if-no-files-found: warn
          retention-days: 14
