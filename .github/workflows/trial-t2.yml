# Trial T2 (mesh): does occt-import-js read STEP, IGES and BREP under Bun 1.4.4 and Node 22?
# Throwaway trial workflow. Runs only on a push to the trial branch. No secrets, no publish.
name: trial-t2

on:
  push:
    branches:
      - trial/t2-mesh

permissions:
  contents: read

jobs:
  measure:
    name: measure (${{ matrix.os }}, ${{ matrix.runtime }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        runtime: [bun, node]
    defaults:
      run:
        shell: bash
        working-directory: trials/t2-mesh
    steps:
      - name: Check out the trial commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun 1.4.4
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Put TEMP and TMP under the runner temp folder (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$env:RUNNER_TEMP"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$env:RUNNER_TEMP"

      - name: Install the pinned occt-import-js package
        run: npm ci --no-audit --no-fund

      # The large sample is not in git. Each entry with a "fetch" URL in samples.json comes from its
      # pinned commit. A checksum mismatch fails the job.
      - name: Fetch the large sample at its pinned commit and check its SHA-256
        run: |
          set -euo pipefail
          while read -r url file sha; do
            mkdir -p "$(dirname "$file")"
            curl --fail --silent --show-error --location "$url" --output "$file"
            echo "$sha  $file" | sha256sum --check --strict -
          done < <(node -e 'for (const x of require("./samples.json").samples.filter((s) => s.fetch)) console.log([x.fetch.url, x.file, x.sha256].join(" "))')

      - name: Record the runtime versions
        run: |
          mkdir -p results
          node --version | tee results/node-version.txt
          if [ "${{ matrix.runtime }}" = "bun" ]; then bun --version | tee results/bun-version.txt; fi

      - name: Measure occt-import-js
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bun measure.mjs > "results/${{ matrix.runtime }}.jsonl" 2> "results/${{ matrix.runtime }}.stderr.txt"
          else
            node measure.mjs > "results/${{ matrix.runtime }}.jsonl" 2> "results/${{ matrix.runtime }}.stderr.txt"
          fi
          cat "results/${{ matrix.runtime }}.jsonl"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: t2-${{ matrix.os }}-${{ matrix.runtime }}
          path: |
            trials/t2-mesh/results/
          if-no-files-found: warn
          retention-days: 14
