% The format of the T6 trial. INITEX reads this file in extended mode:
%   *scieng.ini
% latex.ltx ends with \dump. This file keeps the primitive and makes \dump
% do nothing while latex.ltx runs, then loads the packages of the format and
% dumps. The option dvisvgm makes the graphics driver dvisvgm.def (the
% configuration files color.cfg and graphics.cfg give the default only), so
% pgf selects the driver file pgfsys-dvisvgm.def (pgfutil-latex.def:
% pgfsys-\Gin@driver).
\let\SETdump\dump
\let\dump\relax
\input latex.ltx
\PassOptionsToPackage{dvisvgm}{graphics}
\PassOptionsToPackage{dvisvgm}{graphicx}
\PassOptionsToPackage{dvisvgm}{color}
\PassOptionsToPackage{dvisvgm}{xcolor}
\RequirePackage{xcolor}
\RequirePackage{tikz}
\RequirePackage{circuitikz}
\let\dump\SETdump
\dump
